<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kyn-OpsAgent · AI Advisory Workspace</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/shell.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/operations_chat.css') }}">
</head>
<body>
<div class="app-shell">

  <!-- ============ SIDEBAR (core) ============ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-wordmark">kyndryl<span class="brand-dot">.</span></div>
      <div class="brand-app">OpsAgent</div>
      <div class="brand-sub">ServiceNow Advisory Console</div>
    </div>

    <nav class="nav-section">
      <div class="nav-label">Workspace</div>
      <button class="nav-item is-active" data-view="chat">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 4h16v12H7l-3 3V4z"/></svg>
        </span>
        <span class="nav-text">
          <span class="nav-title">Operations Chat</span>
          <span class="nav-desc">Agent advisory</span>
        </span>
      </button>
      <button class="nav-item" data-view="incidents" disabled title="Not yet implemented">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 3l9 16H3L12 3zm0 6v5m0 3h.01"/></svg>
        </span>
        <span class="nav-text">
          <span class="nav-title">Active Incidents</span>
          <span class="nav-desc">Priority &amp; status</span>
        </span>
      </button>
      <button class="nav-item" data-view="problem" disabled title="Not yet implemented">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 015 5c0 2-1 3-2 4l-1 1v2H10v-2l-1-1c-1-1-2-2-2-4a5 5 0 015-5zM10 19h4M11 22h2"/></svg>
        </span>
        <span class="nav-text">
          <span class="nav-title">Problem Analysis</span>
          <span class="nav-desc">Cause &amp; correlation</span>
        </span>
      </button>
      <button class="nav-item" data-view="knowledge" disabled title="Not yet implemented">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 5c3-2 6-2 8 0v14c-2-2-5-2-8 0V5zM20 5c-3-2-6-2-8 0v14c2-2 5-2 8 0V5z"/></svg>
        </span>
        <span class="nav-text">
          <span class="nav-title">Knowledge</span>
          <span class="nav-desc">Grounded answers</span>
        </span>
      </button>
      <button class="nav-item" data-view="history" disabled title="Not yet implemented">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9v4M3 12l3-3M3 12l3 3M12 7v5l4 2"/></svg>
        </span>
        <span class="nav-text">
          <span class="nav-title">Conversation History</span>
          <span class="nav-desc">Recent sessions</span>
        </span>
      </button>
      <button class="nav-item" data-view="insights" disabled title="Not yet implemented">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 20V10m6 10V4m6 16v-7"/></svg>
        </span>
        <span class="nav-text">
          <span class="nav-title">Insights</span>
          <span class="nav-desc">Operational trends</span>
        </span>
      </button>
    </nav>

    <div class="sidebar-spacer"></div>

    <div class="agent-status">
      <div class="nav-label">Agent Status</div>
      <div class="status-row">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Connecting…</span>
      </div>
      <div class="status-row muted">
        <svg viewBox="0 0 24 24" class="status-icon"><path d="M12 2l9 4-9 4-9-4 9-4zM3 12l9 4 9-4M3 17l9 4 9-4"/></svg>
        Advisory Mode
      </div>
      <div class="status-row muted">
        <svg viewBox="0 0 24 24" class="status-icon"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        Human approval required
      </div>
    </div>

    <div class="sidebar-footer">
      <div class="footer-agent">{{ agent_name }}</div>
      <div class="footer-env">Environment: {{ environment_label }}</div>
    </div>
  </aside>

  <!-- ============ MAIN (core topbar + feature panel) ============ -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-titles">
        <div class="eyebrow">ServiceNow Operations</div>
        <h1>AI Advisory Workspace</h1>
      </div>
      <div class="topbar-actions">
        <span class="pill pill-online" id="onlinePill">
          <span class="pill-dot"></span> Agent Online
        </span>
        <button class="icon-btn" title="Notifications" aria-label="Notifications">
          <svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1112 0c0 5 2 6 2 6H4s2-1 2-6zM10 21a2 2 0 004 0"/></svg>
        </button>
        <button class="btn-ghost" id="newSessionBtn">
          <svg viewBox="0 0 24 24"><path d="M4 4v6h6M20 20v-6h-6M4.5 9a8 8 0 0114.5-3M19.5 15a8 8 0 01-14.5 3"/></svg>
          New session
        </button>
      </div>
    </header>

    {% include "chat_panel.html" %}
  </main>

  <!-- ============ CONTEXT PANEL (feature) ============ -->
  {% include "context_panel.html" %}

</div>

<script src="{{ url_for('static', filename='js/shell.js') }}"></script>
<script src="{{ url_for('static', filename='js/operations_chat.js') }}"></script>
</body>
</html>
